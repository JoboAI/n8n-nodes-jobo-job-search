name: Release to npm

# Runs in the PUBLIC mirror (github.com/JoboAI/n8n-nodes-jobo-job-search), where this
# file lands via the monorepo's connectors-mirror workflow. n8n's verified
# community-node rules require publishing from GitHub Actions in a public
# repo with npm provenance — this workflow IS the n8n publish path; the
# monorepo cannot produce provenance.
#
# Cut a GitHub release (tag vX.Y.Z) in the mirror to publish. Requires the
# mirror-repo secret NPM_TOKEN.
#
# There is no lockfile in this subtree (leaf package): @jobo-ai/connector-core
# is pinned to an exact version and resolves from the npm registry — publish
# connector-core from the monorepo FIRST (tag connector-core-vX.Y.Z there).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      # Node 22: `npm install` here pulls n8n-workflow, whose transitive
      # isolated-vm is a native module requiring Node >=22 (it fails to
      # compile against Node 20's V8). Build-time only — the published
      # package bundles everything and ships no runtime dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify n8n constraints (built bundle)
        run: npm test

      # The committed version is the source of truth, not the tag. Rewriting
      # package.json here instead would publish a version that exists nowhere
      # in git — n8n's verification checks the default branch against npm and
      # fails the submission on the drift. Bump the version in the monorepo,
      # let the mirror sync carry it over, THEN cut the tag.
      - name: Check the release tag matches package.json
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match package.json ($CURRENT). Bump Jobo.Connectors/n8n/package.json in the monorepo, wait for the mirror sync, then re-cut the tag."
            exit 1
          fi
          echo "package.json is at $TAG_VERSION"

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
