<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jobo">
  <title>Jobo</title>
  <!--
    Vector rendering of the Jobo brand mark (raster source of truth:
    Jobo.Data.Website/public/logos/jobo-logo.png) — the brand-gradient squircle
    with the white "Jobo" wordmark above the smile. SVG rather than PNG because
    n8n's verification lint rejects raster node icons
    (n8n-nodes-base/node-class-description-icon-not-svg).
  -->
  <defs>
    <linearGradient id="joboBrand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5482B"/>
      <stop offset="28%" stop-color="#D6209B"/>
      <stop offset="55%" stop-color="#8A05FF"/>
      <stop offset="80%" stop-color="#6A0BD8"/>
      <stop offset="100%" stop-color="#1B33E8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#joboBrand)"/>

  <text x="256" y="270"
        text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="170"
        font-weight="600"
        letter-spacing="-6"
        fill="#fff">Jobo</text>

  <!-- The smile: a stroked arc, rounded caps, matching the wordmark weight. -->
  <path d="M126 330c34 46 79 69 130 69s96-23 130-69"
        fill="none"
        stroke="#fff"
        stroke-width="44"
        stroke-linecap="round"/>
</svg>
